services:
  tonal-garmin-sync:
    build: .
    image: tonal-garmin-sync:latest
    container_name: tonal-garmin-sync
    restart: unless-stopped
    env_file: .env
    environment:
      # Only affects log timestamps; FIT files always use absolute UTC times.
      - TZ=${TZ:-UTC}
    ports:
      # HOST_PORT is what you point Home Assistant at. Change it in .env if
      # something else on the host already uses 8090. The container always
      # listens on 8080 internally.
      - "${HOST_PORT:-8090}:8080"
    volumes:
      # Persistent state: sync log, movement cache, Garmin tokens.
      # Must be writable by uid 1000 (the `node` user the container runs as).
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:'+(process.env.PORT||8080)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
